[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalgraph"
version = "0.1.0"
description = "Health analytics and BLE knowledge RAG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

# The analytics core -- signal model, store, HRV, GATT decoding, simulator and
# the summariser bridge -- is deliberately standard-library only, so it runs and
# tests anywhere. Everything heavier is an optional extra.
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
rag = ["raganything"]
harvest = ["httpx>=0.27"]          # M2: acquisition layer
dev = ["pytest>=7.0", "pytest-asyncio", "httpx>=0.27", "ruff"]

[project.scripts]
vitalgraph-server = "vitalgraph.api.server:main"

[tool.setuptools.packages.find]
include = ["vitalgraph*"]

[tool.ruff]
target-version = "py310"

# The subproject owns its test configuration. The repository root pins
# testpaths = ["tests"], which resolves relative to the root and therefore
# never collects these -- the two suites stay independent in both directions.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
